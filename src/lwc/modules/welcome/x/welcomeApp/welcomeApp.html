<template lwc:render-mode="light">
  <div class="slds-scope slds-theme_default">
    <main class="welcome-page">
      <section
        class="slds-page-header slds-page-header_record-home welcome-hero"
      >
        <div class="slds-grid slds-wrap slds-gutters">
          <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-12">
            <img
              alt="Force Navigator Reloaded"
              class="welcome-logo"
              src="icons/icon128.png"
            />
          </div>
          <div class="slds-col slds-size_1-of-1 slds-large-size_11-of-12">
            <p class="slds-text-title_caps welcome-eyebrow">
              Thanks for installing
            </p>
            <h1 class="slds-text-heading_large">Force Navigator Reloaded</h1>
            <p class="slds-text-body_regular welcome-lead">
              A fast command palette for Salesforce Lightning. Search, launch,
              and navigate without leaving the keyboard.
            </p>
            <div class="welcome-actions">
              <button
                class="slds-button slds-button_brand"
                onclick={handleTryInSalesforceClick}
              >
                {primaryActionLabel}
              </button>
              <button
                class="slds-button slds-button_neutral"
                onclick={handleOpenOptionsClick}
              >
                Open Settings
              </button>
              <button
                class="slds-button slds-button_neutral"
                onclick={handleOpenShortcutsClick}
              >
                Configure Shortcut
              </button>
            </div>
            <p class="slds-text-body_small welcome-footnote">
              Works only in Salesforce Lightning (not in Classic).
            </p>
          </div>
        </div>
      </section>

      <x-welcome-section title="Get started in 60 seconds">
        <ol class="welcome-steps">
          <li class="slds-box slds-theme_default">
            <h3 class="slds-text-heading_small">Open Lightning</h3>
            <p class="slds-text-body_regular">
              Navigate to any Lightning page in your org. Supported domains are
              force.com, salesforce-setup.com, and
              builder.salesforce-experience.com.
            </p>
            <template if:true={hasLightningTab}>
              <a
                class="slds-text-link"
                href="#"
                onclick={handleOpenLightningLinkClick}
              >
                Open your first Lightning tab
              </a>
            </template>
            <template if:false={hasLightningTab}>
              <p class="slds-text-body_small slds-text-color_error">
                Open any Salesforce Lightning tab first.
              </p>
            </template>
          </li>
          <li class="slds-box slds-theme_default">
            <h3 class="slds-text-heading_small">Open the command palette</h3>
            <p class="slds-text-body_regular">
              Press <kbd>{shortcutText}</kbd>&nbsp; to open the command palette.
              Press the shortcut again or <kbd>Esc</kbd> to close it.
            </p>
          </li>
          <li class="slds-box slds-theme_default">
            <h3 class="slds-text-heading_small">Authorize once per org</h3>
            <p class="slds-text-body_regular">
              Run <strong>Extension &gt; Authorize</strong> and choose Allow in
              the Salesforce window. Some orgs need an administrator first,
              see&nbsp;<a
                class="slds-text-link"
                href="#authorization-help"
                onclick={handleAuthorizationHelpLinkClick}
                >Authorize the extension</a
              >.
            </p>
          </li>
          <li class="slds-box slds-theme_default">
            <h3 class="slds-text-heading_small">Search and launch</h3>
            <p class="slds-text-body_regular">
              Type a command, object, flow, or setup page name and press Enter.
            </p>
          </li>
        </ol>
      </x-welcome-section>

      <div
        class="welcome-anchor"
        id="authorization-help"
        lwc:ref="authorizationHelp"
        tabindex="-1"
      >
        <x-welcome-section title="Authorize the extension">
          <p class="slds-text-body_regular welcome-lead">
            The palette reads Setup pages, objects, flows, and other metadata
            through the Salesforce connected
            app&nbsp;<strong>{connectedAppLabel}</strong>. Each org is
            authorized once per browser. Until then the palette offers
            only&nbsp;<strong>Extension &gt; Authorize</strong> and&nbsp;<strong
              >Extension &gt; Options</strong
            >.
          </p>
          <ol class="welcome-steps">
            <li class="slds-box slds-theme_default">
              <h3 class="slds-text-heading_small">
                1. Open the org in Lightning
              </h3>
              <p class="slds-text-body_regular">
                Open any Lightning page of the org you want to navigate and
                press <kbd>{shortcutText}</kbd> to open the command palette.
              </p>
            </li>
            <li class="slds-box slds-theme_default">
              <h3 class="slds-text-heading_small">
                2. Run Extension &gt; Authorize
              </h3>
              <p class="slds-text-body_regular">
                Salesforce opens a window. Sign in if asked and
                choose&nbsp;<strong>Allow</strong>. The extension requests
                the&nbsp;<code>api</code> and <code>refresh_token</code> scopes,
                plus&nbsp;<code>web</code> when My Domain auto-login is enabled.
              </p>
            </li>
            <li class="slds-box slds-theme_default">
              <h3 class="slds-text-heading_small">3. Wait for the commands</h3>
              <p class="slds-text-body_regular">
                After the window closes, the palette reloads and lists the org's
                commands. Access tokens stay in local extension storage and are
                refreshed automatically.
              </p>
            </li>
          </ol>

          <section
            aria-labelledby="authorization-admin-title"
            class="slds-box slds-theme_default welcome-admin"
          >
            <h3 class="slds-text-heading_small" id="authorization-admin-title">
              When Salesforce shows "app must be installed into org"
            </h3>
            <p class="slds-text-body_regular">
              Org policy can require a Salesforce administrator to install the
              connected app before anyone can authorize it. In that case
              Salesforce shows an OAuth error instead of the consent
              page:&nbsp;<code
                >invalid_client: app must be installed into org</code
              >. The extension recognizes this error and explains it in the
              OAuth window and in the Salesforce tab. Approving access in the
              consent window is not always sufficient.
            </p>
            <p class="slds-text-body_regular">
              In&nbsp;<strong>Setup &gt; Connected Apps OAuth Usage</strong
              >,&nbsp;<strong>Allowed</strong> does not
              mean&nbsp;<strong>Installed</strong>. An allowed app can still be
              refused until an administrator
              clicks&nbsp;<strong>Install</strong>. Depending on the app's
              Permitted Users policy, the administrator may also have to assign
              your profile or a permission set.
            </p>
            <h4 class="slds-text-title_bold">Administrator steps</h4>
            <ol class="welcome-admin__steps">
              <template for:each={adminSteps} for:item="step">
                <li key={step.id} class="slds-text-body_regular">
                  {step.text}
                </li>
              </template>
            </ol>
            <h4 class="slds-text-title_bold">Message for your administrator</h4>
            <p class="slds-text-body_small">
              Copy this text and send it to a Salesforce administrator of the
              org.
            </p>
            <pre
              class="welcome-admin__instructions"
              lwc:ref="adminInstructions"
              tabindex="0"
            >
{adminInstructions}</pre>
            <div class="welcome-actions">
              <button
                class="slds-button slds-button_brand"
                onclick={handleCopyAdminInstructions}
                type="button"
              >
                Copy instructions for your administrator
              </button>
              <span
                aria-live="polite"
                class="slds-text-body_small welcome-admin__status"
                role="status"
                >{copyStatus}</span
              >
            </div>
          </section>

          <section class="slds-box slds-theme_default">
            <h3 class="slds-text-heading_small">
              Other authorization messages
            </h3>
            <ul class="welcome-list">
              <li class="slds-text-body_regular">
                <strong>Authorization was not completed.</strong> The window was
                closed before Salesforce confirmed access. Run the&nbsp;<strong
                  >Extension &gt; Authorize</strong
                >&nbsp;command again.
              </li>
              <li class="slds-text-body_regular">
                <strong>Authorization was declined.</strong> Deny was chosen on
                the consent page. Run the command again and choose Allow.
              </li>
              <li class="slds-text-body_regular">
                <strong>Salesforce reported an authorization error.</strong
                >&nbsp;Retry, and if it persists share the reported error code
                with your administrator.
              </li>
            </ul>
          </section>
        </x-welcome-section>
      </div>

      <x-welcome-section title="What it can do">
        <div class="slds-grid slds-wrap slds-gutters">
          <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
            <x-welcome-feature-card
              description="Fuzzy search with usage-based ranking for fast discovery."
              title="Instant search"
            ></x-welcome-feature-card>
          </div>
          <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
            <x-welcome-feature-card
              description="Navigate setup, object metadata, flows, and admin pages quickly."
              title="Setup, objects, flows"
            ></x-welcome-feature-card>
          </div>
          <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
            <x-welcome-feature-card
              description="Choose command sources, add custom commands, or review usage in Settings."
              title="Customizable sources"
            ></x-welcome-feature-card>
          </div>
          <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
            <x-welcome-feature-card
              description="Continue through supported My Domain login pages for orgs you already authorized. Off by default; enable it in Settings."
              title="Optional My Domain auto-login"
            ></x-welcome-feature-card>
          </div>
        </div>
      </x-welcome-section>

      <x-welcome-section title="See it in action">
        <p class="slds-text-body_regular welcome-lead">
          A closer look at the command palette, settings, and extension
          shortcuts.
        </p>
        <div class="slds-grid slds-wrap slds-gutters welcome-shots-grid">
          <x-welcome-screenshot
            alt="Command palette search in a Lightning application"
            caption="Search in a Lightning application (e.g. Application > Home)."
            class="slds-col slds-align-middle slds-medium-size_1-of-2 slds-size_1-of-1"
            src="images/command-palette.png"
          ></x-welcome-screenshot>
          <x-welcome-screenshot
            alt="Options page with JSON configuration and command usage panel"
            caption="Settings page with JSON configuration and command usage panel."
            class="slds-col slds-align-middle slds-medium-size_1-of-2 slds-size_1-of-1"
            src="images/options.png"
          ></x-welcome-screenshot>
          <x-welcome-screenshot
            alt="Command palette search in Salesforce Setup"
            caption="Search in Setup (e.g. Setup Home highlighted)."
            class="slds-col slds-align-middle slds-medium-size_1-of-2 slds-size_1-of-1"
            src="images/fuzzy-search.png"
          ></x-welcome-screenshot>
          <x-welcome-screenshot
            alt="Extension popup with shortcut help and review link"
            caption="Extension popup with shortcuts and review link."
            class="slds-col slds-align-middle slds-medium-size_1-of-2 slds-size_1-of-1"
            src="images/popup.png"
          ></x-welcome-screenshot>
        </div>
      </x-welcome-section>

      <x-welcome-callout
        description="Open Chrome Extensions shortcuts and choose a key combo that fits your workflow."
        title="Set your own shortcut"
      >
        <button
          class="slds-button slds-button_brand"
          onclick={handleOpenShortcutsClick}
          slot="action"
        >
          Open chrome://extensions/shortcuts
        </button>
      </x-welcome-callout>

      <x-welcome-callout
        description="If Force Navigator Reloaded saves you time, please leave a quick review. It helps adoption and future development."
        title="Leave a review"
      >
        <a
          class="slds-button slds-button_neutral"
          href="https://chromewebstore.google.com/detail/force-navigator-reloaded/iniflnopffblekndhplennjijdcfkeak/reviews?utm_source=welcome"
          rel="noreferrer"
          slot="action"
          target="_blank"
        >
          Open reviews
        </a>
      </x-welcome-callout>

      <footer class="welcome-footer">
        <p class="slds-text-body_small">
          Thanks for using Force Navigator Reloaded. Ideas or feedback? Share
          them in the GitHub repository or open a new issue.
        </p>
        <div class="welcome-footer__links">
          <a
            class="slds-text-link"
            href="https://github.com/Damecek/force-navigator-reloaded"
            rel="noreferrer"
            target="_blank"
          >
            Repository
          </a>
          <a
            class="slds-text-link"
            href="https://github.com/Damecek/force-navigator-reloaded/issues/new"
            rel="noreferrer"
            target="_blank"
          >
            Open an issue
          </a>
        </div>
      </footer>
    </main>
  </div>
</template>
