<template lwc:render-mode="light">
  <div
    aria-label={usagePresentation.accessibleLabel}
    class={computedClassNames}
    onclick={handleClick}
    role="option"
  >
    <span class="command-item__label slds-truncate" title={command.label}>
      <template for:each={labelSegments} for:item="segment">
        <mark key={segment.key} lwc:if={segment.isMatch}>{segment.text}</mark>
        <span key={segment.key} lwc:else>{segment.text}</span>
      </template>
    </span>
    <span
      aria-hidden="true"
      class="command-item__usage"
      lwc:if={usagePresentation.isVisible}
    >
      {usagePresentation.text}
    </span>
  </div>
</template>
