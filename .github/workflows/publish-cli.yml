name: Publish Salesforce CLI plugin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing plugin release tag, for example sf-plugin-v0.1.0
        required: true
        type: string
      bootstrap:
        description: First npm release only, using the temporary NPM_TOKEN secret
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-salesforce-cli-plugin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sf-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `sf-plugin-v${version}`) {
            throw new Error(`Release tag must match package version: sf-plugin-v${version}`);
          }
          NODE
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run test:package
      - run: npm pack
      - name: Publish with npm Trusted Publishing
        if: ${{ !inputs.bootstrap }}
        run: npm publish ./force-navigator-reloaded-*.tgz --access public --ignore-scripts
      - name: Publish first version with temporary token
        if: ${{ inputs.bootstrap }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "The first release requires a temporary NPM_TOKEN repository secret." >&2
            exit 1
          fi
          npm publish ./force-navigator-reloaded-*.tgz --access public --ignore-scripts
