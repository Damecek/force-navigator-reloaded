name: Build & Publish Extension
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish from
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test

      - name: Read version
        run: echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: test "$RELEASE_TAG" = "v${NEW_VERSION}"

      - run: npm run build

      - name: Build and verify CLI package
        id: plugin
        run: |
          if [ ! -d packages/sf-plugin ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Tag predates the CLI plugin; releasing the extension only."
            exit 0
          fi
          cd packages/sf-plugin
          npm ci
          npm audit --audit-level=high
          npm test
          npm run test:package
          npm pack
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Zip dist
        id: zip
        run: |
          zip_name="force-navigator-reloaded-${NEW_VERSION}.zip"
          cd dist && zip -r "../${zip_name}" .
          echo "zip_path=${zip_name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: force-navigator-reloaded-${{ env.NEW_VERSION }}
          path: |
            ${{ steps.zip.outputs.zip_path }}
            packages/sf-plugin/force-navigator-reloaded-*.tgz
          if-no-files-found: error

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ env.NEW_VERSION }}
          fail_on_unmatched_files: ${{ steps.plugin.outputs.present == 'true' }}
          files: |
            ${{ steps.zip.outputs.zip_path }}
            packages/sf-plugin/force-navigator-reloaded-*.tgz
          body: |
            ## Browser extension
            Install from the [Chrome Web Store](https://chromewebstore.google.com/detail/iniflnopffblekndhplennjijdcfkeak), or extract the attached ZIP and use **Load unpacked** at `chrome://extensions` with Developer mode enabled.

            ## Salesforce CLI plugin
            Install the latest npm release with `sf plugins install force-navigator-reloaded`.
            The attached `.tgz` contains the plugin built from this release's source. To install that exact build, download it and run `sf plugins install ./<downloaded-file>.tgz`.
            Update registry-installed plugins with `sf plugins update`.

            Extension and plugin versions are independent. Attaching a plugin archive does not publish a new version to npm.

      - uses: mnao305/chrome-extension-upload@f549d5d654694a7722d6abfa64c97409ad5e64c1 # v7.0.0
        with:
          file-path: ${{ steps.zip.outputs.zip_path }}
          extension-id: ${{ secrets.CHROME_PROD_EXTENSION_ID }}
          client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
          client-secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
