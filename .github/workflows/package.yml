name: Build & Publish Extension
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish from
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test

      - name: Read version
        run: echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - run: npm run build

      - name: Zip dist
        id: zip
        run: |
          zip_name="force-navigator-reloaded-${NEW_VERSION}.zip"
          cd dist && zip -r "../${zip_name}" .
          echo "zip_path=${zip_name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: force-navigator-reloaded-${{ env.NEW_VERSION }}
          path: ${{ steps.zip.outputs.zip_path }}
          if-no-files-found: error

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        if: github.event_name == 'push'
        with:
          tag_name: v${{ env.NEW_VERSION }}
          files: ${{ steps.zip.outputs.zip_path }}
          body: |
            # Steps to install extension:
            1. Download the force-navigator-reloaded.zip
            2. Unzip
            3. Go to chrome://extensions/
            4. At the top right, turn on Developer mode
            5. Click Load unpacked
            6. Find and select the unzipped folder

      - uses: mnao305/chrome-extension-upload@fdfe79400af990f5145a319e834aee64907ccff4 # v6.0.0
        with:
          file-path: ${{ steps.zip.outputs.zip_path }}
          extension-id: ${{ secrets.CHROME_PROD_EXTENSION_ID }}
          client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
          client-secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
