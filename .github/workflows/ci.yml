name: CI
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'webpack.config.js'
      - 'lwc.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'webpack.config.js'
      - 'lwc.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build
